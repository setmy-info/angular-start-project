<div id="sidenav" class="sideNavigationPanel" [style.display]="modalService.isOpen() ? '' : 'none'">
    <div id="sideNavigationHeaderPanel">
        <ul>
            <li>
                <button
                    type="button"
                    aria-label="Close navigation menu"
                    (click)="modalService.close()"
                >
                    <i>close</i>
                </button>
            </li>
            <li>
                <span>{{ languageService.translate('view.menu') }}</span>
            </li>
        </ul>
        <!-- span>{{ languageService.translate('view.menu') }}</span>
        <button type="button" aria-label="Close navigation menu" (click)="modalService.close()">
            <i class="material-symbols-outlined">close</i>
        </button-->
    </div>
    <div id="sideNavigationContentPanel">
        <ul>
            @for (item of menuService.rawMenuItems(); track item.id) {
                <li class="sideNavMenuItems">
                    <a
                        [routerLink]="item.path"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
                        (click)="modalService.close()"
                    >
                        <i class="material-symbols-outlined">{{ item.icon }}</i>
                        {{ languageService.translate(item.translationKey || item.label) }}
                    </a>
                </li>
            }
            <li class="sideNavThinMenuItems">
                <hr />
            </li>
            <li class="sideNavMenuItems">
                <a href="javaScript:void(0);" class="noHover textCursor">
                    <i>language</i>{{ languageService.translate('view.language') }}:</a
                >
                <div>
                    <select (change)="onLanguageChange($event)">
                        @for (language of languageService.supportedLanguages; track language.code) {
                            <option
                                [value]="language.code"
                                [selected]="language.code === languageService.currentLanguageCode()"
                            >
                                {{ language.label }}
                            </option>
                        }
                    </select>
                </div>
            </li>
        </ul>
    </div>
</div>
