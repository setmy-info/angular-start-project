<div id="headerPanel">
    <header>
        <ul>
            <li>
                <button
                    type="button"
                    (click)="modalService.toggle()">
                    <i>menu</i>
                </button>
            </li>
            <li [class.hidden]="networkService.isOnline()">
                <button
                    type="button"
                    disabled
                    [attr.aria-label]="languageService.translate('app.offline')"
                    [attr.title]="languageService.translate('app.offline')">
                    <i class="alertMaterialIcon">signal_wifi_off</i>
                </button>
            </li>
            <li>
                <span>{{ languageService.translate('app.title') }}</span>
            </li>
        </ul>
        <ul>
            @for (language of languageService.supportedLanguages; track language.code) {
                <li>
                    <button
                        type="button"
                        [disabled]="language.code === languageService.currentLanguageCode()"
                        [class.active]="language.code === languageService.currentLanguageCode()"
                        (click)="languageService.changeLanguage(language.code)">
                        {{ language.label }}
                    </button>
                </li>
            }
        </ul>
    </header>
    <nav class="phone-hidden">
        <ul>
            @for (item of menuService.rawMenuItems(); track item.id) {
                <li>
                    <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{exact: item.path === '/'}">
                        <!-- i>{{ item.icon }}</i -->
                        <!--i></i-->
                        {{ languageService.translate(item.translationKey || item.label) }}
                    </a>
                </li>
            }
        </ul>
    </nav>
    <consent-body-panel/>
</div>
