<div class="applicationContentMain">
    <article class="articleBody">
        <div class="articleSectionPanel">
            <section>
                @if (documentHtml(); as html) {
                    <h1>{{ languageService.translate('view.articles.title') }}</h1>
                    <hr/>
                    <div id="jsonDocument" [innerHTML]="html | skipSanitizingHtml" contenteditable="true"></div>
                    <div>
                        <button type="button" (click)="parse()">{{ languageService.translate('view.articles.parse') }}</button>
                        <label for="parsedJson">{{ languageService.translate('view.articles.parsed') }}</label><br>
                        <textarea id="parsedJson" rows="6" style="width: 100%;" readonly [value]="parsed()"></textarea>
                    </div>
                } @else if (unknown()) {
                    <h1>{{ languageService.translate('view.articles.title') }}</h1>
                    <p>{{ languageService.translate('view.articles.unknown') }}</p>
                    <p><a routerLink="/articles">{{ languageService.translate('menu.articles') }}</a></p>
                }
            </section>
        </div>
    </article>
</div>
