<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Contact — Brand Page Starter</title>
        <meta
            name="description"
            content="Contact details for the Lorem Ipsum brand — placeholder content for the brand page starter."
        />
        <meta name="robots" content="index, follow" />
        <link rel="icon" href="favicon.ico" type="image/x-icon" />
        <link rel="stylesheet" href="css/index.css" />
    </head>
    <body>
        <div id="brandApp" class="brandPage" v-cloak>
            <div class="brandMasthead">
                <p class="brandMastheadName"><a href="index.html">Lorem Ipsum</a></p>
                <ul class="brandNavigation">
                    <li>
                        <a href="index.html">Home</a>
                    </li>
                    <li>
                        <a href="about.html">About</a>
                    </li>
                    <li>
                        <a href="contact.html" class="brandNavigationCurrent">Contact</a>
                    </li>
                </ul>
                <div class="brandClear"></div>
            </div>

            <div class="brandBanner">
                <h1>Contact</h1>
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
            </div>

            <div class="brandRow">
                <div class="brandContactRow">
                    <span class="brandContactLabel">Organisation</span>
                    <span class="brandContactValue">Lorem Ipsum OÜ</span>
                    <div class="brandClear"></div>
                </div>
                <div class="brandContactRow">
                    <span class="brandContactLabel">Address</span>
                    <span class="brandContactValue">Lorem street 1, Tallinn</span>
                    <div class="brandClear"></div>
                </div>
                <div class="brandContactRow">
                    <span class="brandContactLabel">Phone</span>
                    <span class="brandContactValue">+372 0000 0000</span>
                    <div class="brandClear"></div>
                </div>
                <div class="brandContactRow">
                    <span class="brandContactLabel">Email</span>
                    <span class="brandContactValue">lorem@example.com</span>
                    <div class="brandClear"></div>
                </div>
            </div>

            <div class="brandFooter">
                <span class="brandFooterCopyright">&copy; {{ year }} Lorem Ipsum</span>
                <span class="brandFooterNote">Brand page starter — placeholder content</span>
                <div class="brandClear"></div>
            </div>
        </div>

        <script src="js/vue.global.prod.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
